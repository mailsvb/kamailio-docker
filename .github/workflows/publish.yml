name: publish

# Builds all images and pushes them to the GitHub Container Registry as
# ghcr.io/<repository owner>/<image>, e.g. ghcr.io/sip-server/kamailio
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  push_to_registry:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [kamailio, rtpengine, postgres, admin, echo]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Image name and version
        id: meta
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          name=ghcr.io/$owner/${{ matrix.image }}
          tags=$name:latest,$name:sha-${GITHUB_SHA::7}
          # versioned tag from the build arg default, e.g. KAMAILIO_VERSION=6.1.4
          version=$(sed -nE 's/^ARG [A-Z_]+_VERSION=(.+)$/\1/p' ${{ matrix.image }}/Dockerfile | head -1)
          if [ -n "$version" ]; then
            tags=$tags,$name:$version
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx environment
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
