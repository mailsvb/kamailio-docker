; SIP on the loopback interface, only kamailio talks to asterisk.
; Calls arrive with the request user:
;   vmu-<user> / vmb-<user>  voicemail of <user> (unavailable / busy greeting)
;   vmcheck-<user>           voicemail box of <user> (dial-in, PIN asked)
;   ann-<name>               announcement (see extensions.conf)
; Secure media: kamailio adds X-Media-Crypto: sdes|dtls when the phone offers
; SDES (a=crypto) or DTLS-SRTP (a=fingerprint), see route[MEDIA_CRYPTO]. The
; header selects the endpoint kamailio-sdes / kamailio-dtls, all other
; requests go to the endpoint kamailio (plain RTP).

[global]
type = global
; header first (match_header), then the source address
endpoint_identifier_order = header,ip
user_agent = sip-server media

[transport-kamailio]
type = transport
protocol = udp
bind = 127.0.0.1:5080
; RTP address in the SDP for the phones on the LAN (res_pjsip_nat). media_address
; of the endpoint is not enough: res_pjsip replaces the host IP in the SDP by
; the address of the interface towards kamailio (127.0.0.1)
external_media_address = @PUBLIC_IP@

; options of all endpoints
[kamailio-ep](!)
type = endpoint
transport = transport-kamailio
context = from-kamailio
disallow = all
; asterisk's order decides, the prompts exist per codec (media/Dockerfile).
; opus: encoded from the sln16 prompts. g729: pass-through only (no codec),
; voicemail does not work for phones that offer only G.729
allow = opus,g722,alaw,ulaw,g729
incoming_call_offer_pref = local
direct_media = no
dtmf_mode = rfc4733
; without this the RTP sockets are bound to the transport address (127.0.0.1)
; and can neither reach nor be reached by the phones
media_address = @PUBLIC_IP@
bind_rtp_to_media_address = yes

; every request from kamailio, plain RTP
[kamailio](kamailio-ep)

[kamailio]
type = identify
endpoint = kamailio
match = 127.0.0.1

; SDES-SRTP (RTP/SAVP with a=crypto), optimistic: also RTP/AVP with a=crypto
[kamailio-sdes](kamailio-ep)
media_encryption = sdes
media_encryption_optimistic = yes

[kamailio-sdes]
type = identify
endpoint = kamailio-sdes
match_header = X-Media-Crypto: sdes

; DTLS-SRTP (UDP/TLS/RTP/SAVP with a=fingerprint), self-signed certificate
[kamailio-dtls](kamailio-ep)
media_encryption = dtls
dtls_auto_generate_cert = yes
dtls_verify = no
dtls_setup = actpass
dtls_fingerprint = SHA-256
rtcp_mux = yes

[kamailio-dtls]
type = identify
endpoint = kamailio-dtls
match_header = X-Media-Crypto: dtls
