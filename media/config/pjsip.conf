; SIP on the loopback interface, only kamailio talks to asterisk.
; Calls arrive with the request user:
;   vmu-<user> / vmb-<user>  voicemail of <user> (unavailable / busy greeting)
;   vmcheck-<user>           voicemail box of <user> (dial-in, PIN asked)
;   ann-<name>               announcement (see extensions.conf)

[global]
type = global
endpoint_identifier_order = ip
user_agent = sip-server media

[transport-kamailio]
type = transport
protocol = udp
bind = 127.0.0.1:5080
; RTP address in the SDP for the phones on the LAN (res_pjsip_nat). media_address
; of the endpoint is not enough: res_pjsip replaces the host IP in the SDP by
; the address of the interface towards kamailio (127.0.0.1)
external_media_address = @PUBLIC_IP@

; every request from kamailio
[kamailio]
type = endpoint
transport = transport-kamailio
context = from-kamailio
disallow = all
allow = alaw,ulaw,g722
direct_media = no
dtmf_mode = rfc4733
; without this the RTP sockets are bound to the transport address (127.0.0.1)
; and can neither reach nor be reached by the phones
media_address = @PUBLIC_IP@
bind_rtp_to_media_address = yes

[kamailio]
type = identify
endpoint = kamailio
match = 127.0.0.1
