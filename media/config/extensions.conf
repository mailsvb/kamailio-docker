[general]
static = yes
writeprotect = yes

[from-kamailio]
; voicemail deposit: no answer / not registered (unavailable) and busy
exten => _vmu-.,1,VoiceMail(${EXTEN:4}@default,u)
 same => n,Hangup()
exten => _vmb-.,1,VoiceMail(${EXTEN:4}@default,b)
 same => n,Hangup()

; own voicemail box (settings.voicemail_number), asks for the PIN
; (no N, X or Z in the prefixes: they are wildcards in patterns)
exten => _vmcheck-.,1,VoiceMailMain(${EXTEN:8}@default)
 same => n,Hangup()

; announcements: prompt and Q.850 cause. Kamailio replaces the final reply
; with its own code and Reason header (README.md, Error replies), the causes
; here only match it.
; unknown number (trunk 404 / 604)
exten => ann-unknown,1,Set(PROMPT=ss-noservice)
 same => n,Set(CAUSE=1)
 same => n,Goto(announce,s,1)
; incomplete number (trunk 484)
exten => ann-incomplete,1,Set(PROMPT=cannot-complete-as-dialed)
 same => n,Set(CAUSE=28)
 same => n,Goto(announce,s,1)
; unknown or not implemented feature code
exten => ann-feature,1,Set(PROMPT=feature-not-avail-line)
 same => n,Set(CAUSE=69)
 same => n,Goto(announce,s,1)
; no trunk assigned to the caller
exten => ann-notrunk,1,Set(PROMPT=cannot-complete-as-dialed)
 same => n,Set(CAUSE=57)
 same => n,Goto(announce,s,1)
; trunk call failed (provider error 5xx)
exten => ann-failed,1,Set(PROMPT=cannot-complete-temp-error)
 same => n,Set(CAUSE=34)
 same => n,Goto(announce,s,1)
; trunk not reachable (no reply at all)
exten => ann-unreachable,1,Set(PROMPT=cannot-complete-network-error)
 same => n,Set(CAUSE=38)
 same => n,Goto(announce,s,1)

exten => i,1,Hangup(1)

; early media (183), the call is never answered
[announce]
exten => s,1,Progress()
 same => n,Wait(0.5)
 same => n,Playback(im-sorry&${PROMPT},noanswer)
 same => n,Hangup(${CAUSE})
