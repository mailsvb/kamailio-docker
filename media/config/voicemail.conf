; voicemail boxes come from the database (view vm_mailbox, extconfig.conf):
; context "default", mailbox = username, PIN = subscriber.vm_pin
[general]
format = wav49|wav
attach = no
maxmsg = 100
maxsecs = 180
maxgreet = 60
maxlogins = 3
skipms = 3000
searchcontexts = no
; new messages / messages read: MWI to the phones (res_pjsip_mwi)
pollmailboxes = yes
pollfreq = 30
