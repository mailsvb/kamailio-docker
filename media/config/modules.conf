; only the modules needed for announcements, voicemail and MWI
[modules]
autoload = no

; database (realtime: voicemail boxes, PJSIP endpoints/AoRs for MWI)
load = res_config_pgsql.so
load = res_realtime.so
load = res_sorcery_config.so
load = res_sorcery_memory.so
load = res_sorcery_astdb.so
load = res_sorcery_realtime.so

; SIP towards kamailio
load = res_pjproject.so
load = res_pjsip.so
load = res_pjsip_session.so
load = chan_pjsip.so
load = res_pjsip_sdp_rtp.so
load = res_pjsip_authenticator_digest.so
load = res_pjsip_endpoint_identifier_ip.so
load = res_pjsip_caller_id.so
load = res_pjsip_rfc3326.so
; SDP address external_media_address of the transport (see pjsip.conf)
load = res_pjsip_nat.so
load = res_pjsip_pubsub.so
load = res_pjsip_mwi.so
load = res_pjsip_mwi_body_generator.so
load = res_rtp_asterisk.so
; SDES and DTLS-SRTP (endpoints kamailio-sdes / kamailio-dtls, see pjsip.conf)
load = res_srtp.so
load = res_timing_timerfd.so

; codecs and file formats of the prompts and recordings
load = codec_alaw.so
load = codec_ulaw.so
load = codec_a_mu.so
load = codec_g722.so
load = res_format_attr_opus.so
load = codec_opus_open_source.so
; G.729: prompts and RTP pass-through only (no G.729 codec in Alpine)
load = res_format_attr_g729.so
load = format_g729.so
load = codec_gsm.so
load = format_gsm.so
load = format_wav.so
load = format_wav_gsm.so
load = format_pcm.so
load = format_sln.so

; dialplan and applications
load = pbx_config.so
load = app_playback.so
load = app_voicemail.so
