#!KAMAILIO
#
# Kamailio SIP Server v6.1 - configuration script
#     - users authenticated against PostgreSQL (auth_db)
#     - outgoing calls via SIP trunks assigned to user groups (sqlops, uac)
#     - web: https://www.kamailio.org
#     - git: https://github.com/kamailio/kamailio
#
# Direct your questions about this file to: <sr-users@lists.kamailio.org>
#
# Refer to the Core CookBook at https://www.kamailio.org/wiki/
# for an explanation of possible statements, functions and parameters.
#

####### Defined Values #########

#!define MULTIDOMAIN 0

# - flags
#   FLT_ - per transaction (message) flags
#   FLB_ - per branch flags
#!define FLT_ACC 1
#!define FLT_ACCMISSED 2
#!define FLT_ACCFAILED 3
#!define FLT_NATS 5

#!define FLB_NATB 6
#!define FLB_NATSIPPING 7
# contact is a Unify phone (stored with the registration, restored by lookup)
#!define FLB_UNIFY 8

# - database connection, e.g. postgres://kamailio:secret@127.0.0.1:5432/kamailio
#!defenvs DBURL
#!defexps SQLCON "ca=>" + DBURL
# - realm for digest authentication, must match the realm in table settings
#!defenvs SIP_REALM

####### Global Parameters #########

### LOG Levels: 3=DBG, 2=INFO, 1=NOTICE, 0=WARN, -1=ERR
debug=1
log_stderror=yes

memdbg=5
memlog=5

log_facility=LOG_LOCAL0
# log_prefix="{$mt $hdr(CSeq) $ci} "

/* number of SIP routing processes */
children=4

/* uncomment the next line to disable the auto discovery of local aliases
 * based on reverse DNS on IPs (default on) */
auto_aliases=no

/* SET external IP */
#!substdef "/PUBLIC_IP/$env(PUBLIC_IP)/"
/* IP advertised in SDP towards trunks (public IP when kamailio is behind NAT) */
#!substdef "/EXTERNAL_IP/$env(EXTERNAL_IP)/"

/* listen addresses */
listen=udp:0.0.0.0:5060 advertise PUBLIC_IP:5060
listen=tcp:0.0.0.0:5060 advertise PUBLIC_IP:5060
listen=tls:0.0.0.0:5061 advertise PUBLIC_IP:5061

/* requests to the public IP are local (uri==myself) */
alias=PUBLIC_IP
alias=EXTERNAL_IP

# TCP connection settings
tcp_connection_lifetime=3605
tcp_accept_no_cl=yes
tcp_keepalive=yes
# Number of keepalives sent before dropping the connection
tcp_keepcnt=3
# Time before starting to send keepalives, if the connection is idle
tcp_keepidle=30
# Time interval between keepalive probes, when the previous probe failed
tcp_keepintvl=15

# TLS connection settings
enable_tls=yes

####### Custom Parameters #########

/* These parameters can be modified runtime via RPC interface
 * - see the documentation of 'cfg_rpc' module.
 *
 * Format: group.id = value 'desc' description
 * Access: $sel(cfg_get.group.id) or @cfg_get.group.id */

