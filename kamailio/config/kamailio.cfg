# ----------------- setting module-specific parameters ---------------

# ----- uac params -----
# restore the original From towards the caller (needs rr)
modparam("uac", "restore_mode", "auto")
# credentials for uac_auth() towards trunks, set per call in route[TRUNK]
modparam("uac", "auth_username_avp", "$avp(t_auser)")
modparam("uac", "auth_password_avp", "$avp(t_apass)")
modparam("uac", "auth_realm_avp", "$avp(t_realm)")
# trunk registrations, read from view uacreg (reload: kamcmd uac.reg_reload)
modparam("uac", "reg_db_url", DBURL)
modparam("uac", "reg_contact_addr", "EXTERNAL_IP:5060")
modparam("uac", "reg_timer_interval", 60)

# ----- auth_db params -----
modparam("auth_db", "db_url", DBURL)
# plain text passwords in subscriber.password, kamailio computes the digest
modparam("auth_db", "calculate_ha1", 1)
modparam("auth_db", "password_column", "password")
modparam("auth_db", "use_domain", 0)
# number of the authenticated user, used as P-Asserted-Identity
modparam("auth_db", "load_credentials", "$avp(u_number)=number")

# ----- sqlops params -----
modparam("sqlops", "sqlcon", SQLCON)

# ----- dialog params -----
# fix CSeq of in-dialog requests after uac_auth() added credentials
modparam("dialog", "track_cseq_updates", 1)

# ----- corex params -----
modparam("corex", "nio_intercept", 1)
modparam("corex", "nio_msg_avp", "$avp(msg)")

# ----- tls params -----
modparam("tls", "tls_method", "TLSv1.2+")
modparam("tls", "certificate", "kamailio.pem")
modparam("tls", "private_key", "kamailio.pem")
modparam("tls", "server_name", "kamailio")
modparam("tls", "send_close_notify", 1)

# ----- jsonrpcs params -----
modparam("jsonrpcs", "pretty_format", 1)
/* set the path to RPC fifo control file */
# modparam("jsonrpcs", "fifo_name", "/var/run/kamailio/kamailio_rpc.fifo")
/* set the path to RPC unix socket control file */
modparam("jsonrpcs", "dgram_socket", "/var/run/kamailio/kamailio_rpc.sock")

# ----- ctl params -----
/* set the path to RPC unix socket control file */
# modparam("ctl", "binrpc", "unix:/var/run/kamailio/kamailio_ctl")

# ----- tm params -----
# auto-discard branches from previous serial forking leg
modparam("tm", "failure_reply_mode", 3)
# default retransmission timeout: 30sec
modparam("tm", "fr_timer", 30000)
# default invite retransmission timeout after 1xx: 120sec
modparam("tm", "fr_inv_timer", 120000)
# Set reason text of the automatically sent 100 to an INVITE
modparam("tm", "auto_inv_100_reason", "Trying")
# also match replies of transactions put on wait: with parallel ringing the
# INVITE transaction is on wait right after the 200 OK, the 200 for CANCEL
# and 487 of the other phones arrive afterwards (otherwise CANCEL is
# retransmitted and their 487 is never ACKed)
modparam("tm", "reply_matching", 0)

# ----- rr params -----
# set next param to 1 to add value to ;lr param (helps with some UAs)
modparam("rr", "enable_full_lr", 1)
# append from tag to the RR, required by uac restore_mode "auto"
modparam("rr", "append_fromtag", 1)

# ----- acc params -----
/* what special events should be accounted ? */
modparam("acc", "early_media", 0)
modparam("acc", "report_ack", 0)
modparam("acc", "report_cancels", 0)
/* by default ww do not adjust the direct of the sequential requests.
 * if you enable this parameter, be sure the enable "append_fromtag"
 * in "rr" module */
modparam("acc", "detect_direction", 0)
/* account triggers (flags) */
modparam("acc", "log_flag", FLT_ACC)
modparam("acc", "log_missed_flag", FLT_ACCMISSED)
modparam("acc", "failed_transaction_flag", FLT_ACCFAILED)

# ----- registrar module -----
modparam("registrar", "min_expires", 60)
modparam("registrar", "max_expires", 600)
# per REGISTER limit of parallel registrations: $xavp(reg=>max_contacts)
modparam("registrar", "xavp_cfg", "reg")

# ----- xlog params -----
modparam("xlog", "prefix", "")

# ----- rtpengine -----
# ng control socket, the interfaces "lan" (PUBLIC_IP) and "wan" (advertises
# EXTERNAL_IP) are set on the rtpengine command line in docker-compose.yml
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22222")

####### Routing Logic ########

event_route[network:msg] {
    if (is_incoming()) {
        xinfo("<<<<<<\n$mb\n");
        $avp(msg) = $mb;
    } else {
        xinfo(">>>>>>\n$mb\n");
        $avp(msg) = $mb;
    }
}

/* Main SIP request routing logic
 * - processing of any incoming SIP request starts with this route
 * - note: this is the same as route { ... } */
request_route {

    xnotice("$rm <$fu> to $ru via $RAi <<< $siz\n");

    # per request initial checks
    route(REQINIT);

    # handle NAT
    route(NATDETECT);

    # CANCEL processing
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    # handle retransmissions
    if (!is_method("ACK")) {
        if(t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    # handle requests within SIP dialogs
    route(WITHINDLG);

    ### only initial requests (no To tag)

    # incoming call from a trunk (no credentials, identified by source network)
    if (is_method("INVITE")) {
        route(FROM_TRUNK);
    }

    # only provisioned users may register or start new requests
    route(AUTH);

    # caller is a Unify phone: its replies get X-Siemens-Call-Type
    if (is_method("INVITE") && $ua =~ "Desk_Phone_IP") {
        $avp(xc_rpl) = 1;
    }

    if (is_method("REGISTER")) {
        route(REGISTRAR);
    }

    # RTP: internal calls use direct media, trunk calls are relayed by
    # rtpengine (see route[TRUNK])

    # remove preloaded route headers, record routing is added in
    # route[LOCATION] (local calls) and route[TRUNK] (double RR)
    remove_hf("Route");

    if ($rU==$null) {
        # request with no Username in RURI
        sl_send_reply("484","Address Incomplete");
        exit;
    }

    # update $du to set the destination address for proxying
    # $du = "sip:" + $rd + ":" + $rp + ";transport=";
    route(SPECIALS);
    route(LOCATION);
    exit;
}

# Digest authentication against table subscriber
route[AUTH] {
    auth_check(SIP_REALM, "subscriber", "1");
    $var(rc) = $rc;
    if ($var(rc) < 0) {
        # -2 wrong password, -3 unknown user, -8 auth user != From/To user
        if ($var(rc) == -2 || $var(rc) == -3 || $var(rc) == -8) {
            xnotice("auth failed ($var(rc)) for <$fu> user [$au] from $si:$sp\n");
            sl_send_reply("403", "Forbidden");
            exit;
        }
        auth_challenge(SIP_REALM, "1");
        exit;
    }
    # do not forward credentials and caller supplied identities
    if (!is_method("REGISTER")) {
        consume_credentials();
    }
    remove_hf("P-Asserted-Identity");
    remove_hf("P-Preferred-Identity");
}

# Store location of authenticated users
route[REGISTRAR] {
    if (uri!=myself) {
        sl_send_reply("403", "Not Relaying");
        exit;
    }
    # max. parallel registrations: subscriber.max_contacts, else settings.max_contacts
    sql_query("ca", "SELECT coalesce(s.max_contacts, st.max_contacts, 1) FROM subscriber s CROSS JOIN settings st WHERE s.username = $(au{sql.val})", "mc");
    $var(max) = 1;
    if ($dbr(mc=>rows) > 0) {
        $var(max) = $dbr(mc=>[0,0]);
    }
    sql_result_free("mc");

    # device type: the branch flag is stored with the contact and restored by
    # lookup() for every branch towards this device
    $var(dtype) = "Generic";
    if ($ua =~ "Desk_Phone_IP") {
        setbflag(FLB_UNIFY);
        $var(dtype) = "Unify";
    }

    # save() flags must be static, one call per mode
    $var(unreg) = 0;
    if ($hdr(Contact) =~ "^[ ]*[*]" || $hdr(Expires) == "0" || $ct =~ ";[ ]*expires=0+([^0-9]|$)") {
        # unregistration
        $var(unreg) = 1;
        save("location", "0x01");
        $var(saved) = $rc;
    } else if ($var(max) <= 1) {
        # one contact per AoR: the last registration wins
        save("location", "0x05");
        $var(saved) = $rc;
    } else {
        # several contacts: make room for a new device by dropping the oldest ones
        route(REG_LIMIT);
        $xavp(reg=>max_contacts) = $var(max);
        save("location", "0x01");
        $var(saved) = $rc;
    }
    if ($var(saved) < 0) {
        sl_reply_error();
    } else if ($var(unreg) == 0) {
        # record the device type of the last registration
        sql_query("ca", "UPDATE subscriber SET device_type = '$var(dtype)' WHERE username = $(au{sql.val}) AND device_type <> '$var(dtype)'");
    }
    xnotice("location stored <$tu> $sut (max $var(max), $var(dtype))\n");
    exit;
}

# New registration with $var(max) > 1: unregister the oldest contacts of the
# AoR until the new one fits (a refresh of a stored contact drops nothing)
route[REG_LIMIT] {
    if (!reg_fetch_contacts("location", "$tu", "rc")) return;
    $var(ct) = $(ct{nameaddr.uri});
    $var(i) = 0;
    while ($var(i) < $ulc(rc=>count)) {
        if ($(ulc(rc=>addr)[$var(i)]) == $var(ct)) {
            reg_free_contacts("rc");
            return;
        }
        $var(i) = $var(i) + 1;
    }
    $var(n) = 0;
    while ($ulc(rc=>count) >= $var(max) && $var(n) < 32) {
        # oldest = least recently modified
        $var(old) = 0;
        $var(i) = 1;
        while ($var(i) < $ulc(rc=>count)) {
            if ($(ulc(rc=>modified)[$var(i)]) < $(ulc(rc=>modified)[$var(old)])) {
                $var(old) = $var(i);
            }
            $var(i) = $var(i) + 1;
        }
        xnotice("max $var(max) registrations for <$tu>: dropping $(ulc(rc=>addr)[$var(old)])\n");
        unregister("location", "$tu", "$(ulc(rc=>ruid)[$var(old)])");
        reg_free_contacts("rc");
        if (!reg_fetch_contacts("location", "$tu", "rc")) return;
        $var(n) = $var(n) + 1;
    }
    reg_free_contacts("rc");
}

route[NATDETECT] {
    force_rport();
}

# Relay RTP of trunk calls via rtpengine. $avp(rtp_req_ip) is the address of
# the side a request is sent to, $avp(rtp_rpl_ip) the side its replies go to
# (trunk side address towards the trunk, PUBLIC_IP towards phones). They map
# to the rtpengine interfaces: PUBLIC_IP = "lan", EXTERNAL_IP = "wan".
route[FORCERTP] {
    if ($avp(rtp_req_ip) == $null) return;
    if (has_body("application/sdp") || is_method("BYE")) {
        # media from the sender (reply side) to the receiver (request side)
        $var(rtp_from) = "wan";
        if ($avp(rtp_rpl_ip) == "PUBLIC_IP") {
            $var(rtp_from) = "lan";
        }
        $var(rtp_to) = "wan";
        if ($avp(rtp_req_ip) == "PUBLIC_IP") {
            $var(rtp_to) = "lan";
        }
        rtpengine_manage("replace-origin replace-session-connection ICE=remove direction=$var(rtp_from) direction=$var(rtp_to)");
    }
}

# answers use the interfaces chosen for the offer
route[FORCERTP_REPLY] {
    if ($avp(rtp_rpl_ip) == $null) return;
    if (has_body("application/sdp")) {
        rtpengine_manage("replace-origin replace-session-connection ICE=remove");
    }
}

route[SPECIALS] {
    if (is_method("INVITE")) {
        #uac_replace_from("", "tel:$fU");
        #append_hf("Alert-Info: alert-emergency\r\n");
        return;
    }
}

route[LOCATION] {
    if (uri==myself) {
        # feature codes are never sent to a trunk
        if ($rU =~ "^[*#]") {
            route(FEATURES);
        }
        # internal target: extension (username) or number of a local user
        sql_query("ca", "SELECT username FROM subscriber WHERE username = $(rU{sql.val}) OR number = $(rU{sql.val}) ORDER BY (username = $(rU{sql.val})) DESC LIMIT 1", "lu");
        if ($dbr(lu=>rows) < 1) {
            sql_result_free("lu");
            # everything else leaves via the caller's trunk
            route(TRUNK);
        }
        $rU = $dbr(lu=>[0,0]);
        sql_result_free("lu");
        lookup("location");
        switch ($retcode) {
            case -1:
            case -3:
                sl_send_reply("404", "Not Found");
                exit;
            case -2:
                sl_send_reply("405", "Not Found");
                exit;
        };
    }
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }
    route(RELAY);
    exit;
}

# Feature codes (*xx / #xx), placeholder until features are implemented
route[FEATURES] {
    # *43 echo test, served by the echo container (sipp) on 127.0.0.1:5090
    if ($rU == "*43" && is_method("INVITE")) {
        xnotice("echo test for [$au]\n");
        $ru = "sip:echo@127.0.0.1:5090";
        record_route();
        route(RELAY);
    }
    xnotice("feature code $rU from [$au]\n");
    sl_send_reply("404", "Unknown Feature Code");
    exit;
}

# Outgoing call via the caller's own trunk, or the trunk of one of its groups
route[TRUNK] {
    if (!is_method("INVITE")) {
        sl_send_reply("404", "Not Found");
        exit;
    }

    sql_query("ca", "SELECT t.name, t.domain, coalesce(t.proxy, ''), coalesce(t.auth_username, ''), coalesce(t.auth_password, ''), coalesce(t.realm, ''), coalesce(t.from_user, t.auth_username, ''), t.strip, t.prefix, CASE WHEN t.send_pai THEN 1 ELSE 0 END, CASE WHEN t.lan THEN 1 ELSE 0 END FROM trunk t JOIN (SELECT s.trunk_id, 0 AS src, 0 AS prio FROM subscriber s WHERE s.username = $(au{sql.val}) AND s.trunk_id IS NOT NULL UNION ALL SELECT gt.trunk_id, 1, gt.priority FROM group_trunk gt JOIN user_group ug ON ug.group_id = gt.group_id JOIN subscriber s ON s.id = ug.subscriber_id WHERE s.username = $(au{sql.val})) a ON a.trunk_id = t.id WHERE t.enabled ORDER BY a.src, a.prio, t.id LIMIT 1", "tr");
    if ($dbr(tr=>rows) < 1) {
        sql_result_free("tr");
        xnotice("no trunk for user [$au] calling $rU\n");
        sl_send_reply("403", "No Trunk Assigned");
        exit;
    }
    $avp(t_name) = $dbr(tr=>[0,0]);
    $avp(t_domain) = $dbr(tr=>[0,1]);
    $avp(t_proxy) = $dbr(tr=>[0,2]);
    $avp(t_from) = $dbr(tr=>[0,6]);
    $avp(t_strip) = $dbr(tr=>[0,7]);
    $avp(t_prefix) = $dbr(tr=>[0,8]);
    $avp(t_pai) = $dbr(tr=>[0,9]);
    # address of kamailio as seen by the trunk: LAN or public (NAT)
    if ($dbr(tr=>[0,10]) == 1) {
        $avp(t_ip) = "PUBLIC_IP";
    } else {
        $avp(t_ip) = "EXTERNAL_IP";
    }
    # digest credentials, only for trunks that have them
    if ($dbr(tr=>[0,3]) != $null && $dbr(tr=>[0,3]) != "") {
        $avp(t_auser) = $dbr(tr=>[0,3]);
        $avp(t_apass) = $dbr(tr=>[0,4]);
        # empty realm = answer any realm
        $avp(t_realm) = $dbr(tr=>[0,5]);
    }
    sql_result_free("tr");

    # number normalization: strip leading digits, then add prefix
    $var(num) = $rU;
    if ($avp(t_strip) > 0) {
        $var(num) = $(rU{s.substr,$avp(t_strip),0});
    }
    if ($avp(t_prefix) != $null && $avp(t_prefix) != "") {
        $var(num) = $avp(t_prefix) + $var(num);
    }
    $rU = $var(num);
    $rd = $avp(t_domain);
    $rp = $null;
    if ($avp(t_proxy) != $null && $avp(t_proxy) != "") {
        $du = $avp(t_proxy);
    }

    # caller identity: trunk account in From, user number in PAI
    if ($avp(u_number) == $null || $avp(u_number) == "") {
        $avp(u_number) = $au;
    }
    if ($avp(t_from) == $null || $avp(t_from) == "") {
        $avp(t_from) = $avp(u_number);
    }
    # Record-Route: for trunks behind NAT double RR, LAN address towards the
    # phone and public address towards the trunk
    # (kamailio is reachable there only via NAT)
    if ($avp(t_ip) == "PUBLIC_IP") {
        record_route();
    } else {
        record_route_preset("EXTERNAL_IP:5060;r2=on", "PUBLIC_IP:5060;r2=on");
    }
    uac_replace_from("sip:$avp(t_from)@$avp(t_domain)");
    # some providers (e.g. 1und1) reject a PAI that differs from the account
    if ($avp(t_pai) == 1) {
        append_hf("P-Asserted-Identity: <sip:$avp(u_number)@$avp(t_domain)>\r\n");
    }

    xnotice("call from [$au] to $ru via trunk [$avp(t_name)]\n");

    # track CSeq changes caused by uac_auth()
    route(DLG);
    # trunk dialog: direction, account (Contact user) and kamailio address at the trunk
    $dlg_var(tdir) = "out";
    $dlg_var(cuser) = $avp(t_from);
    $dlg_var(tip) = $avp(t_ip);
    # providers (e.g. 1und1) require the trunk account as Contact user
    $var(cuser) = $avp(t_from);
    $var(cip) = $avp(t_ip);
    route(TRUNK_CONTACT);
    # relay RTP: trunk side address towards the trunk, LAN address towards the phone
    $avp(rtp_req_ip) = $avp(t_ip);
    $avp(rtp_rpl_ip) = "PUBLIC_IP";
    route(FORCERTP);
    t_on_failure("TRUNK_AUTH");
    route(RELAY);
}

# Replace the Contact towards a trunk by <$var(cuser)>@<$var(cip)>, the phone's
# contact is kept in parameter kct and restored in route[WITHINDLG]
route[TRUNK_CONTACT] {
    if (!is_present_hf("Contact")) return;
    $var(ct) = $(ct{nameaddr.uri});
    remove_hf("Contact");
    append_hf("Contact: <sip:$var(cuser)@$var(cip):5060;kct=$(var(ct){s.encode.hexa})>\r\n");
}

# Incoming INVITE from a trunk: identified by source network (trunk.inbound_src)
route[FROM_TRUNK] {
    sql_query("ca", "SELECT t.name, CASE WHEN t.lan THEN 1 ELSE 0 END, t.ring_timeout, t.inbound_group_id, coalesce(t.from_user, t.auth_username, '') FROM trunk t WHERE t.enabled AND t.inbound_group_id IS NOT NULL AND $(si{sql.val})::inet <<= ANY(t.inbound_src) ORDER BY coalesce(t.auth_username = $(rU{sql.val}), false) DESC, t.id LIMIT 1", "ti");
    if ($dbr(ti=>rows) < 1) {
        sql_result_free("ti");
        return;
    }
    $avp(t_name) = $dbr(ti=>[0,0]);
    $var(lan) = $dbr(ti=>[0,1]);
    $avp(t_ring) = $dbr(ti=>[0,2]);
    $var(gid) = $dbr(ti=>[0,3]);
    $avp(t_from) = $dbr(ti=>[0,4]);
    sql_result_free("ti");
    if ($avp(t_from) == $null || $avp(t_from) == "") {
        $avp(t_from) = $rU;
    }
    if ($var(lan) == 1) {
        $avp(t_ip) = "PUBLIC_IP";
    } else {
        $avp(t_ip) = "EXTERNAL_IP";
    }
    route(INBOUND);
}

# Ring all registered members of the trunk's inbound group in parallel
route[INBOUND] {
    xnotice("incoming call from <$fu> to $ru via trunk [$avp(t_name)] from $si\n");
    remove_hf("Route");

    sql_query("ca", "SELECT s.username FROM user_group ug JOIN subscriber s ON s.id = ug.subscriber_id WHERE ug.group_id = $var(gid) ORDER BY s.username", "ig");
    $var(i) = 0;
    $var(found) = 0;
    while ($var(i) < $dbr(ig=>rows)) {
        $var(member) = $dbr(ig=>[$var(i),0]);
        if ($var(found) == 0) {
            # first registered member becomes the R-URI branch
            $ru = "sip:" + $var(member) + "@PUBLIC_IP";
            if (lookup("location")) {
                $var(found) = 1;
            }
        } else {
            # further members as parallel branches
            lookup_to_dset("location", "sip:$var(member)@PUBLIC_IP");
        }
        $var(i) = $var(i) + 1;
    }
    sql_result_free("ig");
    if ($var(found) == 0) {
        xnotice("incoming call via trunk [$avp(t_name)]: no group member registered\n");
        sl_send_reply("480", "Temporarily Unavailable");
        exit;
    }

    # Record-Route: for trunks behind NAT double RR, LAN address towards the
    # phones and public address towards the trunk
    if ($avp(t_ip) == "PUBLIC_IP") {
        record_route();
    } else {
        record_route_preset("PUBLIC_IP:5060;r2=on", "EXTERNAL_IP:5060;r2=on");
    }

    route(DLG);
    $dlg_var(tdir) = "in";
    $dlg_var(cuser) = $avp(t_from);
    $dlg_var(tip) = $avp(t_ip);
    # replies of the phones towards the trunk get the trunk account as Contact
    $avp(rc_user) = $avp(t_from);
    $avp(rc_ip) = $avp(t_ip);

    # relay RTP: LAN address towards the phones, trunk side address in the answer
    $avp(rtp_req_ip) = "PUBLIC_IP";
    $avp(rtp_rpl_ip) = $avp(t_ip);
    route(FORCERTP);

    $var(ms) = $avp(t_ring) * 1000;
    t_set_fr($var(ms));
    t_on_failure("INBOUND_FAIL");
    route(RELAY);
}

# Dialog tracking, started once per initial INVITE
route[DLG] {
    if ($avp(dlg_on) == 1) return;
    $avp(dlg_on) = 1;
    dlg_manage();
}

# X-Siemens-Call-Type for messages to Unify phones: ST-secure when the SDP
# offers secure media (SDES crypto, DTLS fingerprint / SAVP, ZRTP, MIKEY),
# otherwise ST-insecure. An existing header is kept unchanged.
route[XSCT] {
    if (is_present_hf("X-Siemens-Call-Type")) return;
    if (has_body() && $rb =~ "(a=(crypto|fingerprint|zrtp-hash|key-mgmt):|RTP/SAVPF?)") {
        append_hf("X-Siemens-Call-Type: ST-secure\r\n");
    } else {
        append_hf("X-Siemens-Call-Type: ST-insecure\r\n");
    }
}

# Wrapper for relaying requests
route[RELAY] {

    # enable additional event routes for forwarded requests - serial forking, RTP relaying handling, a.s.o.
    if (is_method("INVITE|BYE|SUBSCRIBE|UPDATE")) {
        if(!t_is_set("branch_route")) t_on_branch("MANAGE_BRANCH");
    }
    if (is_method("INVITE|SUBSCRIBE|UPDATE")) {
        if(!t_is_set("onreply_route")) t_on_reply("MANAGE_REPLY");
    }
    if (is_method("INVITE")) {
        if(!t_is_set("failure_route")) t_on_failure("MANAGE_FAILURE");
    }

    # initial INVITE: dialog for every call, remembers which side is a Unify phone
    if (is_method("INVITE") && !has_totag()) {
        route(DLG);
        $avp(xc_init) = 1;
        if ($avp(xc_rpl) == 1) {
            $dlg_var(xc_caller) = 1;
        }
    }

    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

# Per SIP request initial checks
route[REQINIT] {
    if($ua =~ "friendly-scanner|sipcli|VaxSIPUserAgent") {
        # silent drop for scanners - uncomment next line if want to reply
        sl_send_reply("200", "OK");
        exit;
    }

    if (!mf_process_maxfwd_header("70") && $retcode==-1) {
        sl_send_reply("483","Too Many Hops");
        exit;
    }

    if(is_method("OPTIONS") && uri==myself && $rU==$null) {
        sl_send_reply("200","Keepalive");
        exit;
    }

    if(!sanity_check("1511", "7")) {
        xinfo("Malformed SIP message from $si:$sp\n");
        exit;
    }
}

# Handle requests within SIP dialogs
route[WITHINDLG] {
    if (!has_totag()) return;

    # request from a trunk to the rewritten Contact: back to the phone
    # (before loose_route(), which treats a R-URI of myself as strict routing)
    if (uri==myself && $(ru{uri.param,kct}) != $null && $(ru{uri.param,kct}) != "") {
        $ru = $(ru{uri.param,kct}{s.decode.hexa});
    }

    # sequential request withing a dialog should take the path determined by record-routing
    if (loose_route()) {
        if ( is_method("NOTIFY") ) {
            # Add Record-Route for in-dialog NOTIFY as per RFC 6665.
            record_route();
        }
        if ($dlg_var(tdir) != $null) {
            # trunk call: the trunk is the callee of outgoing ("out") and the
            # caller of incoming ("in") calls
            $var(fromtrunk) = 0;
            if ($dlg_var(tdir) == "out" && is_direction("upstream")) {
                $var(fromtrunk) = 1;
            } else if ($dlg_var(tdir) == "in" && is_direction("downstream")) {
                $var(fromtrunk) = 1;
            }
            # relay RTP (re-INVITE, UPDATE, ACK with SDP, BYE)
            if ($var(fromtrunk) == 1) {
                # request from the trunk towards the phone, replies go to the trunk
                $avp(rtp_req_ip) = "PUBLIC_IP";
                $avp(rtp_rpl_ip) = $dlg_var(tip);
                $avp(rc_user) = $dlg_var(cuser);
                $avp(rc_ip) = $dlg_var(tip);
            } else {
                # request from the phone towards the trunk
                $var(cuser) = $dlg_var(cuser);
                $var(cip) = $dlg_var(tip);
                route(TRUNK_CONTACT);
                $avp(rtp_req_ip) = $dlg_var(tip);
                $avp(rtp_rpl_ip) = "PUBLIC_IP";
            }
            route(FORCERTP);
        }
        # Unify phones: X-Siemens-Call-Type on requests to them and on the
        # replies of requests they sent (caller = upstream, callee = downstream)
        if (is_direction("downstream")) {
            $var(xc_to) = $dlg_var(xc_callee);
            $var(xc_from) = $dlg_var(xc_caller);
        } else {
            $var(xc_to) = $dlg_var(xc_caller);
            $var(xc_from) = $dlg_var(xc_callee);
        }
        if ($var(xc_to) == 1) {
            route(XSCT);
        }
        if ($var(xc_from) == 1) {
            $avp(xc_rpl) = 1;
        }
        route(RELAY);
        exit;
    }

    if ( is_method("ACK") ) {
        if ( t_check_trans() ) {
            # no loose-route, but stateful ACK; must be an ACK after a 487 or e.g. 404 from upstream server
            route(RELAY);
            exit;
        } else {
            # ACK without matching transaction ... ignore and discard
            exit;
        }
    }
    sl_send_reply("404","Not here");
    exit;
}

# Manage outgoing branches
branch_route[MANAGE_BRANCH] {
    xinfo("new branch [$T_branch_idx] to $ru\n");
    # initial INVITE to a Unify phone (branch flag restored by lookup)
    if (isbflagset(FLB_UNIFY) && !has_totag()) {
        route(XSCT);
    }
}

# Manage incoming replies
onreply_route[MANAGE_REPLY] {
    if(!sanity_check("17604", "6")) {
        xinfo("Malformed SIP response from $si:$sp\n");
        drop;
    }
    # handle RTP going through kamailio
    route(FORCERTP_REPLY);
    # replies of a phone towards a trunk: trunk account as Contact
    if ($avp(rc_user) != $null) {
        $var(cuser) = $avp(rc_user);
        $var(cip) = $avp(rc_ip);
        route(TRUNK_CONTACT);
    }
    # callee answered from a Unify phone: remember it for in-dialog requests
    if ($avp(xc_init) == 1 && $rs =~ "^2" && isbflagset(FLB_UNIFY)) {
        $dlg_var(xc_callee) = 1;
    }
    # reply towards a Unify phone
    if ($avp(xc_rpl) == 1) {
        route(XSCT);
    }
}

# Manage failure routing cases
failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) exit;
}

# Incoming trunk call not answered: 480 towards the trunk
failure_route[INBOUND_FAIL] {
    rtpengine_delete();
    if (t_is_canceled()) exit;
    if (t_check_status("408") || t_branch_timeout()) {
        xnotice("incoming call via trunk [$avp(t_name)] not answered\n");
        t_reply("480", "Temporarily Unavailable");
    }
}

# Answer digest challenges of a trunk once with the trunk credentials
failure_route[TRUNK_AUTH] {
    if (t_is_canceled()) {
        rtpengine_delete();
        exit;
    }

    if (t_check_status("401|407") && $avp(t_auser) != $null && $avp(t_authdone) == $null) {
        $avp(t_authdone) = 1;
        if (uac_auth()) {
            xnotice("trunk [$avp(t_name)] challenged with $T_reply_code, sending credentials\n");
            t_on_reply("MANAGE_REPLY");
            t_on_failure("TRUNK_AUTH");
            if (!t_relay()) {
                xerr("trunk [$avp(t_name)] relay after auth failed\n");
            }
            exit;
        }
        xerr("trunk [$avp(t_name)] uac_auth failed\n");
    }
    # call failed, release the rtpengine session
    rtpengine_delete();
}
